name: Build macOS App Artifact

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build App
        run: |
          xcodebuild build \
            -project FineTune.xcodeproj \
            -scheme FineTune \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          mkdir -p dist
          APP_PATH="./DerivedData/Build/Products/Release/Curv.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find ./DerivedData/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          fi
          echo "Packaging app from: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/Curv.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Curv-macOS
          path: dist/Curv.zip
